name: Renomear HTML para index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Renomear arquivo HTML para index.html
        run: |
          git config user.name "peokcnfhuj"
          git config user.email "peokcnfhuj@users.noreply.github.com"
          git mv para-alice-belo-tito.html index.html
          git commit -m "Renomear para-alice-belo-tito.html para index.html"
          git push
